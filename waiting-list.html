<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนร่วมรับสิทธิ์ EA | AlphaTrading</title>
    <!-- Font Awesome Icons สำหรับแสดงไอคอนนาฬิกาและโล่ความปลอดภัย -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #0f172a; 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }
        nav { 
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b; 
            width: 100%; 
        }
        .nav-container {
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            height: 64px;
        }
        .brand { 
            font-weight: 800; 
            font-size: 1.25rem; 
            text-decoration: none; 
            color: #ffffff; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand span { color: #f59e0b; }
        .back-home { 
            color: #94a3b8; 
            text-decoration: none; 
            font-size: 0.875rem; 
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-home:hover { color: #ffffff; }
        
        .main-content { 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 48px 16px; 
        }
        .waiting-card { 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 16px; 
            padding: 40px 32px; 
            max-width: 420px; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); 
        }
        .icon-box { 
            width: 64px; 
            height: 64px; 
            background-color: rgba(245, 158, 11, 0.1); 
            color: #f59e0b; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.5rem; 
            margin: 0 auto 24px; 
        }
        h1 { 
            font-size: 1.5rem; 
            font-weight: 900; 
            margin-bottom: 12px; 
            letter-spacing: 0.05em;
        }
        p { 
            color: #94a3b8; 
            font-size: 0.875rem; 
            margin-bottom: 32px; 
            line-height: 1.6;
        }
        .btn-tally { 
            background-color: #f59e0b; 
            color: #0f172a; 
            display: block; 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            font-weight: 800; 
            text-decoration: none; 
            font-size: 0.9rem; 
            transition: background-color 0.2s, transform 0.2s; 
            box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.2);
        }
        .btn-tally:hover { 
            background-color: #d97706; 
            transform: translateY(-1px);
        }
        .btn-tally i {
            margin-right: 6px;
        }
        .footer-note { 
            font-size: 0.75rem; 
            color: #64748b; 
            margin-top: 24px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        footer { 
            text-align: center; 
            padding: 24px 16px; 
            font-size: 0.75rem; 
            color: #475569; 
            border-top: 1px solid #1e293b; 
        }
    </style>
</head>
<body>
    
    <!-- NAVIGATION -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="brand"><i class="fa-solid fa-chart-line"></i> ALPHA<span>TRADING</span></a>
            <a href="index.html" class="back-home"><i class="fa-solid fa-house"></i> กลับหน้าแรก</a>
        </div>
    </nav>

    <!-- MAIN BOX -->
    <main class="main-content">
        <div class="waiting-card">
            <div class="icon-box"><i class="fa-regular fa-clock"></i></div>
            <h1>Next-Gen EA Waiting List</h1>
            <p>เปิดลงทะเบียนจองสิทธิ์ทดสอบระบบเทรดอัตโนมัติ XAUUSD สำหรับผู้ใช้กลุ่มแรก จำกัดจำนวนพอร์ตทดสอบ</p>
            
            <!-- 🌟 วางลิงก์ Tally ฟอร์มของคุณแทนที่เครื่องหมาย # ตรงนี้ได้เลยครับ -->
            <a href="https://tally.so/r/GevbdZ" target="_blank" class="btn-tally">
                <i class="fa-solid fa-pen-to-square"></i> กดที่นี่เพื่อกรอกฟอร์มลงทะเบียน (Tally)
            </a>
            
            <div class="footer-note"><i class="fa-solid fa-shield-halved"></i> ข้อมูลจะถูกเก็บรักษาตามนโยบาย PDPA</div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 AlphaTrading. All rights reserved. โฮสต์บน GitHub</p>
    </footer>
    
</body>
</html>
